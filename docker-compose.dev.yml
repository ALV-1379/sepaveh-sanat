services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      APP_ORIGIN: ${DEV_ORIGIN:-http://localhost:8080}
    command: ["sh", "-c", "npm run migrate -w backend && npm run dev -w backend"]
    volumes:
      - ./backend/src:/app/backend/src:ro
  frontend:
    build:
      target: development
    environment:
      API_PROXY: http://backend:3000
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/index.html:/app/frontend/index.html:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  nginx:
    volumes:
      - ./infrastructure/nginx/proxy.dev.conf:/etc/nginx/conf.d/default.conf:ro
