services:
  db:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sepaveh}
      POSTGRES_USER: ${POSTGRES_USER:-sepaveh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    image: ${BACKEND_IMAGE:-sepaveh-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20000000}
      TRUST_PROXY: "1"
    volumes:
      - type: bind
        source: ${UPLOAD_HOST_DIR:-/u01/services/sepawe/uploads}
        target: /app/uploads
    networks: [data, web]
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "npm run migrate -w backend && npm start -w backend"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:-sepaveh-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm}
        NGINX_IMAGE: ${NGINX_IMAGE:-ghcr.io/nginxinc/nginx-unprivileged:stable-alpine}
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/nginxinc/nginx-unprivileged:stable-alpine}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    depends_on:
      backend: { condition: service_healthy, restart: true }
      frontend: { condition: service_healthy, restart: true }
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  postgres:
networks:
  web:
  data:
    internal: true
