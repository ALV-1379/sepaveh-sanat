image: node:22-bookworm
stages: [install, lint, test, build, docker-build, push, deploy]

install:
  stage: install
  script:
    - npm ci --cache .npm
    - npm run generate -w backend
  artifacts:
    paths: [node_modules/]
    expire_in: 1 day
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

lint:
  stage: lint
  needs: [install]
  script: [npm run lint]

test:
  stage: test
  needs: [install]
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://postgres@postgres:5432/postgres
  script:
    - npm run migrate -w backend
    - npm test

build:
  stage: build
  needs: [install, lint, test]
  script: [npm run build]
  artifacts:
    paths: [frontend/dist/]

docker-build:
  stage: docker-build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: [build]
  parallel:
    matrix:
      - COMPONENT: [frontend, backend]
  script:
    - docker build -f "$COMPONENT/Dockerfile" -t "$COMPONENT:$CI_COMMIT_SHA" .
    - docker save "$COMPONENT:$CI_COMMIT_SHA" -o "$COMPONENT.tar"
  artifacts:
    paths: ["$COMPONENT.tar"]
    expire_in: 1 day

push:
  stage: push
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: [docker-build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - export IMAGE_BASE="${REGISTRY_IMAGE_BASE:-$CI_REGISTRY_IMAGE}"
    - export REGISTRY_HOST="${PRIVATE_REGISTRY_HOST:-$CI_REGISTRY}"
    - printf '%s' "${PRIVATE_REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}" | docker login "$REGISTRY_HOST" -u "${PRIVATE_REGISTRY_USER:-$CI_REGISTRY_USER}" --password-stdin
    - |
      for component in frontend backend; do
        docker load -i "$component.tar"
        docker tag "$component:$CI_COMMIT_SHA" "$IMAGE_BASE/$component:$CI_COMMIT_SHA"
        docker push "$IMAGE_BASE/$component:$CI_COMMIT_SHA"
      done

deploy:
  stage: deploy
  tags: [production]
  needs: [push]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment: production
  script:
    - export IMAGE_BASE="${REGISTRY_IMAGE_BASE:-$CI_REGISTRY_IMAGE}"
    - export FRONTEND_IMAGE="$IMAGE_BASE/frontend:$CI_COMMIT_SHA"
    - export BACKEND_IMAGE="$IMAGE_BASE/backend:$CI_COMMIT_SHA"
    - cd "${DEPLOY_DIRECTORY:?Set DEPLOY_DIRECTORY}"
    - docker compose pull backend frontend
    - docker compose up -d --no-build --wait
